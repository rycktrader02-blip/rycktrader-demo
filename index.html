<style>
:root{--bg:#000000;--card:#0a0e16;--line:#1a2740;--gold:#1e3a6e;--text:#e6eaf2;--muted:#8b97ad;--green:#3dcf7a;--red:#e07070}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",Inter,system-ui,sans-serif;background:#000;color:var(--text)}
body{font-family:"DM Sans",Inter,system-ui,sans-serif}
.price,.gauge b,.sheet,input,select{font-family:"IBM Plex Mono",ui-monospace,monospace}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sub{line-height:1.45}
.card{border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.asset{border-radius:16px;transition:border-color .15s,transform .15s}
.asset:hover{border-color:#3d5a44;transform:translateY(-1px)}

button,.btn,.nav button,.topbar button,.tfsw button{
  transition: background-color .22s ease, color .22s ease, border-color .22s ease, transform .18s ease, box-shadow .22s ease, opacity .22s ease;
}
button:hover,.btn:hover,.topbar button:hover,.tfsw button:hover{
  transform: translateY(-1px);
  filter: brightness(1.08);
}
button:active,.btn:active,.topbar button:active,.tfsw button:active{
  transform: translateY(0) scale(.98);
  transition-duration: .08s;
}

.btn{border-radius:12px!important;letter-spacing:.04em;text-transform:none!important;font-family:"DM Sans",sans-serif!important;font-weight:700}
.btn.gold{box-shadow:0 6px 16px rgba(125,202,160,.16)}
.chip{border-radius:999px!important;letter-spacing:.02em;text-transform:none!important;padding:6px 10px}
.nav{backdrop-filter:blur(10px);background:#101612ee}
.nav button{border-radius:12px!important;text-transform:none!important;font-family:"DM Sans",sans-serif!important;font-size:12px;letter-spacing:0}
.topbar{padding:12px 14px;background:#121816}
.topbar button{border-radius:12px;padding:11px 10px}
.gauge{box-shadow:0 0 0 1px #2c3a32}
.search,select,input[type=number]{border-radius:12px}

.price,.gauge b,input,select,.sheet,.tape{font-family:"Share Tech Mono",ui-monospace,monospace}

.iot{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.iot .chip{font-family:"Share Tech Mono",monospace;font-size:10px}

.btn{border-radius:3px!important;letter-spacing:.14em;text-transform:uppercase;font-family:"Rajdhani",sans-serif}
.nav button{border-radius:3px!important;letter-spacing:.08em;text-transform:uppercase;font-family:"Share Tech Mono",monospace;font-size:10px}
.chip{border-radius:2px!important;letter-spacing:.06em;text-transform:uppercase}
.gauge{box-shadow:0 0 16px rgba(57,255,180,.25)}

.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.desk{display:flex;flex-direction:column;flex:1;min-height:0}
#livePane{display:flex;flex-direction:column;flex:1;min-width:0;min-height:55vh;background:#000}
.desk{flex-direction:row}
.pages{flex:0 0 300px;width:300px;max-width:300px}

.livehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:8px}
.livebox canvas{height:min(64vh,560px)}
.livehead{padding:8px 10px;margin:0;background:#101410;border-bottom:1px solid var(--line)}
#tvchart,.tvbox{flex:1;width:100%;min-height:0;height:auto;border:0;border-radius:0;background:#000;margin:0;overflow:hidden;position:relative}
#tvFrame,#tvchart iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}

#tvFrame{flex:1;min-height:280px;width:100%;border:1px solid var(--line);border-radius:12px;background:#000;margin-top:8px}
#tvOpen{color:var(--gold);font-size:12px;font-weight:700;text-decoration:none}
#brokerPane{display:none;flex-direction:column;min-width:0}
#brokerPane iframe{flex:1;min-height:420px;width:100%;border:1px solid var(--line);border-radius:12px;background:#000;margin-top:8px}
@media(min-width:720px){
  .app{max-width:none;height:100vh}
  .desk{flex-direction:row;flex:1;min-height:0}
  .pages{flex:0 0 300px;width:300px;max-width:300px}
  #livePane{display:flex;flex-direction:column;flex:1;padding:0;border-left:1px solid var(--line);background:#0c0f0c;min-width:0;min-height:100vh}
  #brokerPane.show{display:flex;flex:0 0 38%;padding:8px;border-left:1px solid var(--line);background:#071018}
  .nav{position:fixed;left:0;right:auto;bottom:0;width:300px}
}
@media(min-width:1400px){
  .pages{flex:0 0 300px}
  #livePane{flex:1}
  #brokerPane.show{flex:1.2}
}
.pages{flex:1;overflow:auto;padding:14px 14px 88px}
.page{display:none}.page.on{display:block}
.nav{position:sticky;bottom:0;background:#101410;border-top:1px solid #2a332a;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 4px 12px}
.nav button{background:0;border:0;color:#7d8c80;font-size:11px;font-weight:700;padding:8px 2px;border-radius:12px}
.nav button.on{color:#8fd4a6;background:#1a241c}

.chartbox{background:#08131f;border:1px solid #1c334d;border-radius:12px;overflow:hidden;margin:8px 0}
.chartbox canvas{width:100%;height:186px;display:block}
.tape .trow{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #1c1c1c;font-size:11px}
.tape .trow:last-child{border:0}
.fib .lvl span{font-variant-numeric:tabular-nums}


.topbar{display:flex;gap:6px;padding:8px;background:#101410;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:8}
.topbar button{flex:1;background:#1a211a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 8px;font:700 13px Inter;cursor:pointer}
.topbar button.on{background:#1a241c;color:var(--gold);border-color:#3d5a44}

h1{font-size:20px;font-weight:800}.sub{color:var(--muted);font-size:12px;margin:4px 0 10px}
.search,select,input[type=number]{width:100%;background:#161b16;border:1px solid #2a332a;color:var(--text);border-radius:12px;padding:11px 12px;font:14px Inter;margin:6px 0}
.asset{display:flex;align-items:center;gap:8px;padding:11px;border:1px solid #1c334d;border-radius:14px;margin-bottom:8px;background:#141814}
.nm{flex:1}.nm b{display:block;font-size:14px}.nm span{color:var(--muted);font-size:11px}
.bar{width:64px;height:6px;background:#222;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.price{font-size:28px;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:11px;font-weight:700;padding:5px 8px;border-radius:99px;background:#1a211a;color:#a3b5a8}
.chip.up{background:#0d2a1c;color:var(--green)}.chip.dn{background:#2a1218;color:#ff8b8b}
.headrow{display:flex;justify-content:space-between;gap:8px}
.gauge{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.trends{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tf{border-radius:12px;padding:10px 6px;text-align:center;background:#0c0c0c;border:1px solid #222}
.tf span{display:block;font-size:10px;color:var(--muted)}
.lvl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1b1b1b;font-size:13px}
.now{background:#14240f;border:1px solid #2a5a32;border-radius:10px;padding:8px 10px;margin:6px 0;display:flex;justify-content:space-between}
.sc2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.bull,.bear{border-radius:14px;padding:12px;font-size:12px;line-height:1.45}
.bull{background:#102418;border:1px solid #1d5a33}.bear{background:#2a1214;border:1px solid #6a2424}
.bull h3{color:var(--green);margin-bottom:6px}.bear h3{color:#ff8b8b;margin-bottom:6px}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800}
.gold{background:linear-gradient(180deg,#7af0de,#2bb8a4);color:#231b04}
.green{background:#1f9a55;color:#fff}.ghost{background:#141414;color:#ddd;border:1px solid #333}
.acc{border:1px solid #1c334d;border-radius:14px;margin-bottom:8px;background:#0e0e0e}
.acc h4{padding:12px;cursor:pointer;font-size:14px}

/* FOX skin */
:root{
  --bg:#080808;--card:rgba(18,18,20,.86);--line:rgba(255,179,0,.18);
  --gold:#FFB300;--text:#f4f4f5;--muted:#8a8a8a;--green:#3dcf7a;--red:#e07070;
  --ink:#0A0A0C;
}
html,body{background:#080808!important;color:#f4f4f5!important;font-family:Inter,system-ui,sans-serif!important}
h1,.brand b,.bigdir{font-family:Sora,Inter,sans-serif!important;letter-spacing:-.03em}
.price,.gauge b,.sheet,input,select,.tape{font-family:"JetBrains Mono",ui-monospace,monospace!important}
.app,.pages,#livePane,.nav,.topbar{background:#080808!important}
.pages{border-right:1px solid rgba(255,179,0,.12)}
.card,.asset,.acc,.sig,.bull,.bear,.box,.st,.now,.load,.warn,.chartbox,.sheetwrap{
  background:rgba(16,16,18,.9)!important;
  border:1px solid rgba(255,179,0,.16)!important;
  backdrop-filter:blur(12px);
  border-radius:16px!important;
}
.topbar{background:#0c0c0e!important;border-bottom:1px solid rgba(255,179,0,.14)!important}
.nav{background:#0c0c0e!important;border-right:1px solid rgba(255,179,0,.14)!important;border-top:0!important}
.nav button,.topbar button,.tfsw button,.chip,.search,select,input[type=number],.sheet input,.sheet select{
  background:#121214!important;
  border:1px solid rgba(255,179,0,.16)!important;
  color:#e8e8ea!important;
  font-family:Inter,sans-serif!important;
  text-transform:none!important;
  letter-spacing:0!important;
  border-radius:12px!important;
}
.nav button.on,.topbar button.on,.tfsw button.on,.chip.up{
  background:linear-gradient(180deg,#FFB300,#d49200)!important;
  color:#1a1200!important;
  border-color:#FFB300!important;
  font-weight:700!important;
}
.btn,.btn.gold,.gold{
  background:linear-gradient(180deg,#FFB300,#e0a000)!important;
  background-image:linear-gradient(180deg,#FFB300,#e0a000)!important;
  color:#1a1200!important;
  border:0!important;
  border-radius:14px!important;
  font-family:Sora,Inter,sans-serif!important;
  font-weight:800!important;
  letter-spacing:.02em!important;
  text-transform:none!important;
  box-shadow:0 8px 24px rgba(255,179,0,.22)!important;
}
.btn.green{background:#14301c!important;color:#b7e6c4!important;border:1px solid #1d5a33!important}
.ghost{background:#141416!important;color:#ddd!important;border:1px solid rgba(255,255,255,.1)!important}
.chip.dn{background:#2a1218!important;color:#ff8b8b!important}
#livePane{background:#0A0A0C!important;border-left:1px solid rgba(255,179,0,.12)!important}
.livehead{background:#0c0c0e!important;border-bottom:1px solid rgba(255,179,0,.12)!important}

.gauge{box-shadow:0 0 0 1px rgba(255,179,0,.35),0 0 18px rgba(255,179,0,.12)!important}

const fmt=(n,d=2)=>Number(n).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
function sma(a,n){const o=Array(a.length).fill(null);let s=0;for(let i=0;i<a.length;i++){s+=a[i];if(i>=n)s-=a[i-n];if(i>=n-1)o[i]=s/n;}return o;}


function stochK(h,l,c,n){
  const o=Array(c.length).fill(null);
  for(let i=n-1;i<c.length;i++){
    let hh=-1e9,ll=1e9;
    for(let k=i-n+1;k<=i;k++){ hh=Math.max(hh,h[k]); ll=Math.min(ll,l[k]); }
    o[i]=hh===ll?50:100*(c[i]-ll)/(hh-ll);
  }
  return o;
}
function cciArr(h,l,c,n){
  const tp=c.map((_,i)=>(h[i]+l[i]+c[i])/3);
  const o=Array(c.length).fill(null);
  for(let i=n-1;i<c.length;i++){
    const sl=tp.slice(i-n+1,i+1); const m=sl.reduce((a,b)=>a+b,0)/n;
    const md=sl.reduce((a,b)=>a+Math.abs(b-m),0)/n;
    o[i]=md? (tp[i]-m)/(0.015*md):0;
  }
  return o;
}
function haBars(bars){
  const out=[];
  bars.forEach((b,i)=>{
    const haC=(b.o+b.h+b.l+b.c)/4;
    const haO=i? (out[i-1].o+out[i-1].c)/2 : (b.o+b.c)/2;
    out.push({o:haO,c:haC,h:Math.max(b.h,haO,haC),l:Math.min(b.l,haO,haC)});
  });
  return out;
}

function wma(arr,n){
  const out=Array(arr.length).fill(null);
  const den=n*(n+1)/2;
  for(let i=n-1;i<arr.length;i++){
    let s=0, ok=true;
    for(let k=0;k<n;k++){
      const v=arr[i-n+1+k];
      if(v==null){ok=false;break;}
      s+=v*(k+1);
    }
    if(ok) out[i]=s/den;
  }
  return out;
}

function ema(a,n){const o=Array(a.length).fill(null);const k=2/(n+1);let seed=null,acc=0;for(let i=0;i<a.length;i++){acc+=a[i];if(i===n-1){seed=acc/n;o[i]=seed;}else if(i>=n){seed=a[i]*k+seed*(1-k);o[i]=seed;}}return o;}
function sd(a){const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/a.length);}
function rsi(c,n=14){const o=Array(c.length).fill(null);if(c.length<n+1)return o;let ag=0,al=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];if(d>=0)ag+=d;else al-=d;}ag/=n;al/=n;o[n]=al===0?100:100-(100/(1+ag/al));for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];ag=(ag*(n-1)+Math.max(d,0))/n;al=(al*(n-1)+Math.max(-d,0))/n;o[i]=al===0?100:100-(100/(1+ag/al));}return o;}
function macdH(c){const e12=ema(c,12),e26=ema(c,26);const line=c.map((_,i)=>e12[i]==null||e26[i]==null?null:e12[i]-e26[i]);const valid=line.filter(v=>v!=null);const sig=ema(valid,9);const signal=Array(line.length).fill(null);let j=0;const f=line.findIndex(v=>v!=null);if(f>=0)for(let i=f;i<line.length;i++)signal[i]=sig[j++];return line.map((v,i)=>v==null||signal[i]==null?null:v-signal[i]);}
function parse(raw){return raw.map(x=>({t:x[0],l:x[1],h:x[2],o:x[3],c:x[4]})).sort((a,b)=>a.t-b.t);}

  return arr.map(x=>{
    const c=+x.bid||+x.ask||0; const h=+x.high||c; const l=+x.low||c; const t=+(x.timestamp||0);
    return {t,o:c,h:Math.max(h,c),l:Math.min(l||c,c),c};
  }).filter(b=>b.c>0).sort((a,b)=>a.t-b.t);
}

let _dws=null,_dwait=[],_dcb={},_did=1;
function derivSock(){
  return new Promise((res,rej)=>{
    if(_dws && _dws.readyState===1) return res(_dws);
    if(_dwait.length){ _dwait.push({res,rej}); return; }
    _dwait=[{res,rej}];
    let ws;
    try{ ws=new WebSocket("wss://ws.binaryws.com/websockets/v3?app_id=1089"); }
    catch(e){ const q=_dwait; _dwait=[]; q.forEach(x=>x.rej(e)); return; }
    const to=setTimeout(()=>{ try{ws.close()}catch(e){}; const q=_dwait; _dwait=[]; q.forEach(x=>x.rej(new Error("timeout FX"))); },8000);
    ws.onopen=()=>{ clearTimeout(to); _dws=ws; const q=_dwait; _dwait=[]; q.forEach(x=>x.res(ws)); };
    ws.onerror=()=>{ clearTimeout(to); _dws=null; const q=_dwait; _dwait=[]; q.forEach(x=>x.rej(new Error("ws FX"))); };
    ws.onclose=()=>{ _dws=null; };
    ws.onmessage=ev=>{
      let j; try{ j=JSON.parse(ev.data); }catch(e){ return; }
      const cb=_dcb[j.req_id];
      if(cb){ delete _dcb[j.req_id]; cb(j); }
    };
  });
}
function derivHistory(code, gran){
  gran=+gran||300;
  if(![60,120,180,300,600,900,1800,3600,14400,86400].includes(gran)) gran=300;
  return derivSock().then(ws=>new Promise((resolve,reject)=>{
    const id=++_did;
    const to=setTimeout(()=>{ delete _dcb[id]; reject(new Error("timeout FX")); },2800);
    _dcb[id]=j=>{
      clearTimeout(to);
      if(j.error){ reject(new Error(j.error.message||"FX")); return; }
      const cs=j.candles||[];
      if(!cs.length){ reject(new Error("sem vela")); return; }
      resolve(cs.map(c=>({t:+c.epoch,o:+c.open,h:+c.high,l:+c.low,c:+c.close})).filter(b=>b.c>0));
    };
    ws.send(JSON.stringify({ticks_history:code,adjust_start_time:1,count:48,end:"latest",style:"candles",granularity:gran,req_id:id}));
  }));
}

}

function synthBars(id,g,n){
  n=n||80;
  const key=String(id||"X");
  let seed=0; for(let i=0;i<key.length;i++) seed=(seed*33+key.charCodeAt(i))>>>0;
  let px=1.12+(seed%80)/1000;
  if(/JPY/i.test(key)) px=148+(seed%400)/100;
  if(/XAU|GOLD|OURO/i.test(key)) px=2650+(seed%90);
  if(/XAG|SILVER/i.test(key)) px=31+(seed%20)/10;
  if(/BTC/i.test(key)) px=64000+(seed%1800);
  if(/ETH/i.test(key)) px=2480+(seed%220);
  if(/XRP/i.test(key)) px=1.52+(seed%40)/100;
  if(/INR/i.test(key)) px=83+(seed%40)/10;
  const step=+g||60;
  const now=Math.floor(Date.now()/1000);
  const t0=now-now%step-n*step;
  const out=[];
  for(let i=0;i<n;i++){
    const wave=Math.sin((i+seed%13)/5.5)*(0.0009+ (seed%7)/10000);
    const noise=((seed>>((i%8)*2))%9-4)/10000;
    const o=px, c=Math.max(px*0.2, px*(1+wave+noise));
    const h=Math.max(o,c)*(1+Math.abs(noise)*2);
    const l=Math.min(o,c)*(1-Math.abs(noise)*2);
    out.push({t:t0+i*step,o,h,l,c});
    px=c;
  }
  return out;
}

function atrN(bars,n){
  n=n||atrLen();
  if(!bars||bars.length<n+2) return null;
  const tr=[];
  for(let i=1;i<bars.length;i++){
    const b=bars[i],p=bars[i-1];
    tr.push(Math.max(b.h-b.l,Math.abs(b.h-p.c),Math.abs(b.l-p.c)));
  }
  const slice=tr.slice(-n);
  return slice.reduce((s,x)=>s+x,0)/slice.length;
}
function volState(bars){
  const n=atrLen(), cfg=atrCfg();
  if(!bars||bars.length<n+6) return {ok:true,lab:"NORMAL",pct:0,ratio:1,why:"Amostra curta",atr:0,n:n,mode:atrMode()};
  const atr=atrN(bars,n); const px=bars.at(-1).c;
  if(!atr||!px) return {ok:false,lab:"—",pct:0,ratio:0,why:"ATR indisponível",atr:0,n:n,mode:atrMode()};
  const pct=atr/px*100;
  const tr=[];
  for(let i=1;i<bars.length;i++){
    const b=bars[i],p=bars[i-1];
    tr.push(Math.max(b.h-b.l,Math.abs(b.h-p.c),Math.abs(b.l-p.c)));
  }
  const base=tr.slice(-(n*4),-n);
  const med=base.length?base.reduce((s,x)=>s+x,0)/base.length:atr;
  const ratio=atr/Math.max(med,1e-12);
  let lab="NORMAL", ok=true, why="Faixa operacional";
  if(ratio<cfg.loR || pct<cfg.loP){ lab="BAIXA"; ok=false; why="Mercado travado — ATR abaixo do piso"; }

  return {ok,lab,pct,ratio,why,atr,n,mode:atrMode()};
}

function pickStratSig(a,bars,m5){
  if(!bars||bars.length<20) return {dir:null,conf:0,sname:"—",why:"Sem velas",n:0};
  const want=ST.strat||"auto";
  let best=null, n=0;
  const list=want==="auto"?STRATS.filter(s=>!INDIC_IDS[s.id]):STRATS.filter(s=>s.id===want);
  for(const s of list){
    const ev=evalS(s.id,bars);
    if(ev&&ev.dir){
      n++;
      ev.sname=s.short; ev.sid=s.id;
      if(!best || ev.conf>best.conf) best=ev;
    }
  }
  if(!best) return {dir:null,conf:0,sname:"—",why:"Nenhuma estratégia sozinha neste par",n:0};
  return {dir:best.dir,conf:best.conf,sname:best.sname,why:best.why,n:1,sid:best.sid};
}
async function loadRank(){
  const box=$("list");
  if(box) box.innerHTML="<p class='muted'>Gerando o sinal de cada par…</p>";
  ST.filt="fx";
  const fxs=ASSETS.filter(a=>a.src==="fx");
  let quotes={};
  try{ quotes=await fxQuotes(); }catch(e){}
  ST.rank=fxs.map(a=>{
    const q=quotes[a.ticker]||quotes[a.id]||{};
    const last=+q.bid||0, chg=+(q.pctChange||0);
    return {a,chg,sc:0,px:last,ok:last>0,lado:"…",cls:chg>0?"up":chg<0?"dn":"",dir:null,sname:"…",why:""};
  });
  paint($("q")?$("q").value:"");
  const chunk=6;
  for(let i=0;i<fxs.length;i+=chunk){
    const part=fxs.slice(i,i+chunk);
    const got=await Promise.all(part.map(async a=>{
      try{
        const m1=closedBars(await candles(a.id,60).catch(()=>[]));
        const m5=m1&&m1.length>=20?null:closedBars(await candles(a.id,300).catch(()=>[]));
        const sig=pickStratSig(a,m1&&m1.length>=20?m1:m5,m5||m1);

        const prev=m1&&m1.length>12?m1.at(-13).c:last;
        const chg=prev?((last-prev)/prev)*100:0;
        return {a,chg,sc:sig.conf||0,px:last,ok:!!last,lado:sig.dir||"AGUARDE",cls:sig.dir==="CALL"?"up":sig.dir==="PUT"?"dn":"",dir:sig.dir,sname:sig.sname,why:sig.why,n:sig.n};
      }catch(e){
        return {a,chg:0,sc:0,px:0,ok:false,lado:"SEM FEED",cls:"",dir:null,sname:"—",why:String(e.message||e),n:0};
      }
    }));
    const map=new Map((ST.rank||[]).map(r=>[r.a.id,r]));
    got.forEach(r=>map.set(r.a.id,r));
    ST.rank=[...map.values()].filter(r=>r.a&&r.a.src==="fx").sort((x,y)=> ((y.dir?1:0)-(x.dir?1:0))||(y.sc-x.sc));
    paint($("q")?$("q").value:"");
  }
}

function fibRetrace(bars){
  const sl=(bars||[]).slice(-80);
  if(sl.length<8) return {top:0,bot:0,up:true,lvls:[]};
  let hi=sl[0], lo=sl[0];
  sl.forEach(b=>{ if(b.h>hi.h) hi=b; if(b.l<lo.l) lo=b; });
  const last=sl.at(-1).c, mid=(hi.h+lo.l)/2, up=last>=mid;
  const top=hi.h, bot=lo.l, span=Math.max(top-bot,1e-12);
  const ps=[0,0.236,0.382,0.5,0.618,0.786,1];
  const lvls=ps.map(p=>({p, px: up? top-span*p : bot+span*p}));
  return {top,bot,up,lvls,span};
}
function flowTape(bars,n=10){
  return (bars||[]).slice(-n).map(b=>{
    const body=Math.abs(b.c-b.o), rng=Math.max(b.h-b.l,1e-12);
    const buy=b.c>=b.o, press=body/rng;
    const wickUp=b.h-Math.max(b.c,b.o), wickDn=Math.min(b.c,b.o)-b.l;
    let lab="DOJI";
    if(press>0.58 && buy) lab="COMPRA";
    else if(press>0.58 && !buy) lab="VENDA";
    else if(wickDn>wickUp*1.35 && buy) lab="DEFESA";
    else if(wickUp>wickDn*1.35 && !buy) lab="REJEIÇÃO";
    else lab=buy?"ALÍVIO":"PRESSÃO";
    return {t:b.t,o:b.o,h:b.h,l:b.l,c:b.c,buy,lab,press};
  });
}


function proPick(bars,m1,m5){
  const b1=m1&&m1.length>=20?m1:bars;
  if(!b1||b1.length<8) return {dir:null,conf:0,why:"Sem velas"};
  const ids=[["mira","Miracle"],["ari","ARI Fluxo"],["pull","Pullback"],["pa","S/R"],["eng","Engolfo"],["pin","Pin Bar"],["bos","BOS"],["ob","Order Block"],["fvg","FVG"],["brt","Break Retest"],["liq","Liquidez"],["mss","MSS"],["snip","Sniper"],["mega","Mega Fluxo"],["star","Estrela"],["cnt_sol","Soldados"]];
  let best=null;
  ids.forEach(x=>{
    try{
      const ev=x[0]==="mira"?miracleArrow(closedBars(b1)):x[0]==="ari"?ariFluxo(b1):evalS(x[0],b1);
      if(!ev||!ev.dir) return;
      const pack=Object.assign({sname:x[1],sid:x[0],same:x[0]==="ari"?1:!!ev.same},ev);
      if(!best || (pack.conf||0)>(best.conf||0)) best=pack;
    }catch(e){}
  });
  if(!best||!best.dir) return {dir:null,conf:0,why:"Nenhuma estratégia sozinha neste par. Espera a próxima vela."};
  return {
    dir:best.dir,
    conf:Math.min(93, Math.round(best.conf||80)),
    sname:best.sname,
    sid:best.sid,
    same:!!best.same,
    why:best.why||("Estratégia "+best.sname+" sozinha."),
    nsetas:1
  };
}
function flowEntry(a,bars,m1,m5){
  const pick=proPick(bars,m1,m5);
  return Object.assign({a:a}, pick);
}

function flowBias(bars){
  const tape=flowTape(bars,10);
  let buy=0,sell=0;
  tape.forEach(x=>{
    if(x.lab==="COMPRA"||x.lab==="DEFESA"||x.lab==="ALÍVIO") buy++;
    if(x.lab==="VENDA"||x.lab==="REJEIÇÃO"||x.lab==="PRESSÃO") sell++;
  });
  const last=tape.length?tape[tape.length-1]:null;
  let lado="NEUTRO";
  if(buy>=sell+2) lado="COMPRA";
  else if(sell>=buy+2) lado="VENDA";
  return {lado,buy,sell,last:last?last.lab:"—",tape};
}
function retraceNow(bars){
  const fib=fibRetrace(bars);
  if(!fib.lvls||!fib.lvls.length||!bars||!bars.length) return {zona:"—",p:null,pull:false,fib,txt:"sem swing"};
  const last=bars.at(-1).c;
  let best=fib.lvls[0], d=Infinity;
  fib.lvls.forEach(lv=>{ const x=Math.abs(last-lv.px); if(x<d){d=x;best=lv;} });
  const pull=best.p>=0.382&&best.p<=0.786;
  const zona="Fibo "+(best.p*100).toFixed(1).replace(".0","")+"%";
  return {zona,p:best.p,px:best.px,pull,fib,txt:(fib.up?"retração da alta":"retração da baixa")+" em "+zona+(pull?" · zona de pullback":"")};
}

function drawChart(canvasId, bars, fib){
  const c=document.getElementById(canvasId); if(!c||!bars||!bars.length) return;
  const sl=bars.slice(-48);
  const dpr=window.devicePixelRatio||1;
  const W=c.clientWidth||390, H=186;
  c.width=Math.floor(W*dpr); c.height=Math.floor(H*dpr);
  const g=c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  const pad=10;
  const extra=(fib&&fib.lvls||[]).map(x=>x.px);
  const hi=Math.max(...sl.map(b=>b.h), ...extra, sl[0].h);
  const lo=Math.min(...sl.map(b=>b.l), ...extra, sl[0].l);
  const y=v=> pad+(H-pad*2)*(1-(v-lo)/Math.max(hi-lo,1e-12));
  const w=(W-pad*2)/sl.length;
  g.clearRect(0,0,W,H);
  g.fillStyle="#08131f"; g.fillRect(0,0,W,H);
  (fib&&fib.lvls||[]).forEach((lv,i)=>{
    g.strokeStyle=(lv.p===0.5||lv.p===0.618)?"rgba(224,185,58,.45)":"rgba(42,36,22,.9)";
    g.beginPath(); g.moveTo(0,y(lv.px)); g.lineTo(W,y(lv.px)); g.stroke();
  });
  sl.forEach((b,i)=>{
    const x=pad+i*w+w/2, up=b.c>=b.o;
    g.strokeStyle=up?"#3ee08a":"#ff5c6a";
    g.fillStyle=up?"#3ee08a":"#ff5c6a";
    g.beginPath(); g.moveTo(x,y(b.h)); g.lineTo(x,y(b.l)); g.stroke();
    const top=y(Math.max(b.o,b.c)), bot=y(Math.min(b.o,b.c));
    g.fillRect(x-Math.max(1.4,w*0.3), top, Math.max(2.6,w*0.6), Math.max(1,bot-top));
  });
}

function autoIndics(bars){
  if(!bars||bars.length<26) return {ok:0,vote:null,rows:[],html:"",why:"Velas insuficientes"};
  const c=bars.map(b=>b.c), h=bars.map(b=>b.h), l=bars.map(b=>b.l), last=bars.at(-1);
  const rv=rsi(c).at(-1); const mh=macdH(c).at(-1);
  const s8=sma(c,8).at(-1), s20=sma(c,20).at(-1);
  const k=stochK(h,l,c,14).at(-1);
  const mid=s20, slc=c.slice(-20);
  let mean=0; slc.forEach(x=>mean+=x); mean/=slc.length;
  let v=0; slc.forEach(x=>v+=(x-mean)*(x-mean));
  const dev=Math.sqrt(v/slc.length)||0;
  const bbU=mid+2*dev, bbL=mid-2*dev;
  const vs=typeof volState==="function"?volState(bars):{lab:"—",pct:0};
  const rows=[];
  let call=0,put=0;
  if(rv!=null){ const lab=rv>70?"sobrecompra":rv<30?"sobrevenda":"neutro"; rows.push({n:"RSI 14",v:rv.toFixed(1)+" · "+lab,dir:rv<30?"CALL":rv>70?"PUT":null}); if(rv<32) call++; if(rv>68) put++; }
  if(mh!=null){ rows.push({n:"MACD",v:(mh>=0?"histograma +":"histograma −"),dir:mh>0?"CALL":mh<0?"PUT":null}); if(mh>0) call++; else if(mh<0) put++; }
  if(s8!=null&&s20!=null){ const up=s8>s20; rows.push({n:"MM8/MM20",v:up?"cruzadas para cima":"cruzadas para baixo",dir:up?"CALL":"PUT"}); if(up) call++; else put++; }
  if(k!=null){ rows.push({n:"Estocástico",v:k.toFixed(0)+(k>80?" · topo":k<20?" · fundo":""),dir:k<20?"CALL":k>80?"PUT":null}); if(k<20) call++; if(k>80) put++; }
  if(mid){ const pos=last.c>bbU?"acima da banda":last.c<bbL?"abaixo da banda":"dentro das bandas"; rows.push({n:"Bollinger",v:pos,dir:last.c<bbL?"CALL":last.c>bbU?"PUT":null}); if(last.c<bbL) call++; if(last.c>bbU) put++; }
  rows.push({n:"ATR",v:(vs.pct?vs.pct.toFixed(3)+"% · ":"")+ (vs.lab||"—"),dir:null});
  let vote=null;
  if(call>=put+2) vote="CALL";
  else if(put>=call+2) vote="PUT";
  const html="<div class='ind-auto'><div class='muted'>INDICADORES AUTOMÁTICOS</div>"+rows.map(r=>"<div class='ind-row'><span>"+r.n+"</span><b class='"+(r.dir==="CALL"?"up":r.dir==="PUT"?"down":"")+"'>"+r.v+"</b></div>").join("")+"<p class='muted' style='margin:6px 0 0'>Voto dos indicadores: <b class='"+(vote==="CALL"?"up":vote==="PUT"?"down":"")+"'>"+(vote==="CALL"?"COMPRA":vote==="PUT"?"VENDA":"sem maioria")+"</b></p></div>";
  return {ok:1,vote,rows,html,call,put};
}

function showPanelTab(tab){

  const fab=$("aiFab"); if(fab) fab.classList.remove("show");

  if(sig) sig.style.display=onSig?"block":"none";

  if(ST.book.maxDay==null) ST.book.maxDay=8;
  if(ST.book.maxStreak==null) ST.book.maxStreak=3;
  return ST.book;
}
function saveBook(){ try{ localStorage.setItem("norte-book",JSON.stringify(ST.book)); }catch(e){} 
  const b=book(); const stake=b.bank0*(b.risco/100);
  ST.plan={name:"RyckTrader",p:b.risco,bank:saldoNow(),txt:stake.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})};
}
function saldoNow(){ const b=book(); let s=b.bank0; for(const o of b.ops){ if(o.res==="WIN") s+=o.valor*(o.payout/100); else if(o.res==="LOSS") s-=o.valor; } return s; }
function brl(n){ return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function lossStreak(ops){
  let n=0;
  for(let i=ops.length-1;i>=0;i--){ if(ops[i].res==="LOSS") n++; else break; }
  return n;
}
function todayOps(ops){
  const tag=new Date().toISOString().slice(0,10);
  return ops.filter(o=>o.dia===tag);
}
function evPayout(wr,payout){
  const w=(wr||0)/100, p=(payout||0)/100;
  return w*p - (1-w);
}

function sessionRisk(){
  const b=book(); const s=saldoNow();
  const risco=Math.min(5, Math.max(0.5, +b.risco||2));
  const stake=s*(risco/100);
  const streak=typeof lossStreak==="function"?lossStreak(b.ops):0;
  const today=typeof todayOps==="function"?todayOps(b.ops):[];
  const hitMeta=s>=(b.meta||1e15), hitStop=s<=(b.stop||0);
  const hitDay=today.length>=(b.maxDay||8);
  const hitStreak=streak>=(b.maxStreak||3);
  const locked=hitMeta||hitStop||hitDay||hitStreak;
  const why=hitStop?"STOP":hitMeta?"META":hitStreak?"LOSS STREAK":hitDay?"LIMITE DO DIA":"OK";
  return {b,s,risco,stake,streak,today:today.length,locked,why};
}

const BRK={ws:null,auth:null,bal:null,cur:"USD",status:"off",id:1,wait:{},auto:false};
function brkToken(){ return (localStorage.getItem("rt-deriv-token")||"").trim(); }
function brkAppId(){ return (localStorage.getItem("rt-deriv-app")||"1089").trim()||"1089"; }
function brkSymbol(a){
  if(!a) return null;
  if(a.src==="fx") return "frx"+String(a.ticker||"").replace("/","");
  const cry={"BTC-USD":"cryBTCUSD","ETH-USD":"cryETHUSD","SOL-USD":"crySOLUSD","ADA-USD":"cryADAUSD","XRP-USD":"cryXRPUSD","LTC-USD":"cryLTCUSD"};
  return cry[a.id]||null;
}
function brkPaint(){
  const el=$("aiBrkSt"); if(!el) return;
  if(BRK.status==="on" && BRK.auth){
    const demo=/VRTC|VRW|demo/i.test(BRK.auth.loginid||"")?"DEMO":"REAL";
    el.className="ok";

  } else if(BRK.status==="conn"){

  } else {
    el.className="off"; el.textContent="Deriv desconectada";
  }
}
function brkSend(obj){
  return new Promise((resolve,reject)=>{
    if(!BRK.ws || BRK.ws.readyState!==1) return reject(new Error("socket fechado"));
    const id=++BRK.id;
    const to=setTimeout(()=>{ delete BRK.wait[id]; reject(new Error("timeout Deriv")); },12000);
    BRK.wait[id]={resolve,reject,to};
    try{ BRK.ws.send(JSON.stringify({...obj,req_id:id})); }
    catch(e){ clearTimeout(to); delete BRK.wait[id]; reject(e); }
  });
}
function brkHandle(j){
  const w=j.req_id && BRK.wait[j.req_id];
  if(j.msg_type==="balance" && j.balance){
    BRK.bal=+j.balance.balance;
    BRK.cur=j.balance.currency||BRK.cur;
    brkPaint();
  }
  if(j.msg_type==="proposal_open_contract" && j.proposal_open_contract){
    brkOnContract(j.proposal_open_contract);
  }
  if(w){
    clearTimeout(w.to); delete BRK.wait[j.req_id];
    if(j.error) w.reject(new Error(j.error.message||"Deriv"));
    else w.resolve(j);
  }
}
function brkDisconnect(){
  try{ if(BRK.ws) BRK.ws.close(); }catch(e){}
  BRK.ws=null; BRK.auth=null; BRK.status="off"; brkPaint();
}
function brkConnect(){
  const token=brkToken();
  if(!token){ BRK.status="off"; BRK.err="Sem token"; brkPaint(); return Promise.reject(new Error("Cole o token da Deriv")); }
  brkDisconnect();
  BRK.status="conn"; brkPaint();
  return new Promise((resolve,reject)=>{
    let ws;
    try{ ws=new WebSocket("wss://ws.binaryws.com/websockets/v3?app_id="+encodeURIComponent(brkAppId())); }
    catch(e){ BRK.status="err"; BRK.err=e.message; brkPaint(); return reject(e); }
    BRK.ws=ws;
    const to=setTimeout(()=>{ BRK.status="err"; BRK.err="timeout"; brkPaint(); reject(new Error("timeout")); },10000);
    ws.onopen=async()=>{
      try{
        const j=await brkSend({authorize:token});
        clearTimeout(to);
        BRK.auth=j.authorize||{};
        BRK.bal=+BRK.auth.balance;
        BRK.cur=BRK.auth.currency||"USD";
        BRK.status="on"; BRK.err="";
        try{ await brkSend({balance:1,subscribe:1}); }catch(e){}
        brkPaint();
        resolve(BRK.auth);
      }catch(e){
        clearTimeout(to);
        BRK.status="err"; BRK.err=e.message; brkPaint();
        reject(e);
      }
    };
    ws.onmessage=ev=>{ try{ brkHandle(JSON.parse(ev.data)); }catch(e){} };
    ws.onclose=()=>{ if(BRK.status==="on"){ BRK.status="off"; brkPaint(); } };
    ws.onerror=()=>{ BRK.status="err"; BRK.err="ws"; brkPaint(); };
  });
}
function brkOnContract(poc){
  if(!poc) return;
  const done=poc.is_sold || poc.status==="won" || poc.status==="lost";
  if(!done) return;
  const win=poc.status==="won" || (+poc.profit>0);
  const a=ST._brkLive && ST._brkLive[poc.contract_id];
  if(a && a.logged) return;
  if(a) a.logged=1;
  try{
    const b=book();
    const now=new Date();
    b.ops.push({
      data:now.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}),
      dia:now.toISOString().slice(0,10),
      ativo:(a&&a.ticker)||poc.underlying||"—",
      tf:ST.tf==="300"?"M5":"M1",
      dir:(a&&a.dir)||poc.contract_type||"—",
      valor:+(a&&a.stake)||+poc.buy_price||0,
      payout:b.payout, res:win?"WIN":"LOSS",
      src:"deriv", cid:poc.contract_id
    });
    saveBook();
  }catch(e){}
  ST._deskNote="Contrato "+poc.contract_id+" · "+(win?"WIN":"LOSS")+" · P/L "+Number(poc.profit||0).toFixed(2);
  deskRender();
}
async function brkBuy(a,dir){
  if(BRK.status!=="on") await brkConnect();
  const rk=typeof sessionRisk==="function"?sessionRisk():null;
  if(rk && rk.locked) throw new Error("Sessão bloqueada: "+rk.why);
  const sym=brkSymbol(a);
  if(!sym) throw new Error("Este par não tem contrato Rise/Fall na Deriv");
  const stake=Math.max(0.35, +(localStorage.getItem("rt-deriv-stake")||1));
  const dur=ST.tf==="300"?5:1;
  const prop=await brkSend({
    proposal:1, amount:stake, basis:"stake",
    contract_type:dir==="PUT"?"PUT":"CALL",
    currency:BRK.cur||"USD",
    duration:dur, duration_unit:"m",
    symbol:sym
  });
  const p=prop.proposal; if(!p||!p.id) throw new Error("sem proposta");
  const bought=await brkSend({buy:p.id, price:p.ask_price||stake});
  const rec=bought.buy||{};
  ST._brkLive=ST._brkLive||{};
  ST._brkLive[rec.contract_id]={ticker:a.ticker||a.id,dir,stake,logged:0};
  try{ await brkSend({proposal_open_contract:1, contract_id:rec.contract_id, subscribe:1}); }catch(e){}
  return rec;
}

async function deskAnalyze(id){
  const a=ASSETS.find(x=>x.id===id); if(!a) return;
  if(ST._anaLock===id) return;
  ST._anaLock=id;
  ST.asset=a;
  try{ deskSetTv(a); }catch(e){}
  ST._deskSig=ST._deskSig||{};
  const waitTo=ms=>new Promise(r=>setTimeout(r,ms));
  const withT=(p,ms)=>Promise.race([p.catch(()=>[]), waitTo(ms).then(()=>[])]);
  ST._deskHtmlKey="";
  ST._deskSig[id]={wait:1,step:"Lendo Volume..."};
  deskRender();
  await waitTo(120);
  ST._deskSig[id]={wait:1,step:"Cruzando fluxo..."};
  deskRender();
  try{
    const g=+ST.tf||60;
    const pack=await Promise.all([
      withT(candles(a.id,g), 3500),
      g===60?Promise.resolve([]):withT(candles(a.id,60), 2500),
      g===300?Promise.resolve([]):withT(candles(a.id,300), 2500)
    ]);
    const live=pack[0]&&pack[0].length?pack[0]:[];
    const bars=live.length?live:closedBars(pack[0]);
    const m1=g===60?bars:(pack[1]&&pack[1].length?pack[1]:closedBars(pack[1]||bars));
    const m5=g===300?bars:(pack[2]&&pack[2].length?pack[2]:closedBars(pack[2]||bars));
    ST.m1=m1; ST.m5=m5;
    let best=proPick(bars&&bars.length?bars:[], m1, m5);
    const dir=best&&best.dir||null;
    const conf=dir?Math.max(80, Math.min(93, Math.round(best.conf||80))):0;
    const gsec=+ST.tf||60;
    ST._deskSig[id]={dir:dir||null,conf,why:(best&&best.why)||"Nenhuma estratégia sozinha neste ativo",sname:(best&&best.sname)||"",candle:Math.floor(Date.now()/1000/gsec),auto:0};
    ST.signal={dir,conf,a,why:best&&best.why};
    ST._deskHtmlKey="";
    deskRender();
  }catch(e){
    ST._deskSig[id]={dir:null,conf:0,wait:0,why:"Sem leitura neste ativo. Clica de novo em Analisar Sinal."};
    ST._deskHtmlKey="";
    deskRender();
  }
  ST._anaLock=null;
}

  });

function voiceScore(v){
  const n=(v.name||"").toLowerCase(), lang=(v.lang||"").toLowerCase();
  let s=0;
  if(lang==="pt-br") s+=40;
  else if(lang==="pt-pt") s+=8;
  else if(lang.startsWith("pt")) s+=6;
  if(/google/.test(n) && /portugu[eê]s do brasil|pt-br/.test(n+" "+lang)) s+=90;
  if(/google/.test(n) && lang==="pt-br") s+=85;
  if(/antonio online \(natural\)|antônio online \(natural\)/.test(n)) s+=88;
  if(/microsoft antonio/.test(n) && /natural|neural|online/.test(n)) s+=78;
  if(/duarte online \(natural\)/.test(n)) s+=52;
  if(/microsoft daniel/.test(n)) s+=42;
  if(/ant[oô]nio|antonio|daniel|duarte|henrique/.test(n)) s+=22;
  if(/neural|natural|online \(natural\)|premium|wavenet/.test(n)) s+=18;
  if(/maria|francisca|thalita|luciana|heloisa|fernanda|leticia|raquel|female/.test(n)) s-=50;
  if(/espa|spanish|en-us|english|zira|david|mark/.test(n+" "+lang)) s-=30;
  return s;
}
function pickVoice(){
  const list=speechSynthesis.getVoices()||[];
  if(!list.length) return null;
  const want=ST.voiceName || localStorage.getItem("rt-voice") || "";
  if(want){
    const hit=list.find(v=>v.name===want);
    if(hit) return hit;
  }
  const best=list.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null;
  if(best){ ST.voiceName=best.name; ST._voiceName=best.name; }
  return best;
}

function speakNow(txt){
  if(ST.panelTab!=="sinais") return false;
  if(ST.voice===false) return false;
  if(!window.speechSynthesis) return false;
  const clean=String(txt||"").replace(/\s+/g," ").trim();
  if(!clean) return false;
  if(ST._speaking){ if(ST._queuedSpeak!==clean) ST._queuedSpeak=clean; return false; }
  if(ST._lastSpoken===clean && Date.now()-(ST._lastSpokenAt||0)<12000) return true;
  ST._lastSpoken=clean;
  ST._lastSpokenAt=Date.now();
  ST._speaking=true;
  ST._queuedSpeak="";
  try{
    const v=pickVoice();
    const nm=((v&&v.name)||"").toLowerCase();
    const google=/google/.test(nm);
    try{ speechSynthesis.resume(); }catch(e){}
    ST._sayQ=(ST._sayQ||0)+1;
    const tok=ST._sayQ;
    const u=new SpeechSynthesisUtterance(clean);
    u.lang=(v&&v.lang)||"pt-BR";
    u.rate=google?1.0:0.96;
    u.pitch=google?1.0:0.94;
    u.volume=1;
    if(v) u.voice=v;
    const done=()=>{
      if(tok!==ST._sayQ) return;
      ST._speaking=false;
      ST._saidAt=Date.now();
      roboSay(clean,false);
      const next=ST._queuedSpeak;
      ST._queuedSpeak="";
      if(next && next!==clean) setTimeout(()=>{ try{ speakNow(next); }catch(e){} }, 350);
    };
    u.onstart=()=>{ if(tok===ST._sayQ){ ST._speaking=true; roboSay(clean,true); } };
    u.onend=done;
    u.onerror=()=>{ ST._speaking=false; ST._voiceOk=false; roboSay(clean,false); };
    speechSynthesis.speak(u);
    return true;
  }catch(e){ ST._speaking=false; return false; }
}

    try{ window.parent.postMessage({ryck:"size",w:Math.ceil(r.width+12),h:Math.ceil(r.height+12)},"*"); }catch(e){}
  };
  window.addEventListener("load", pingSize);
  setTimeout(pingSize, 400);
  setInterval(pingSize, 1200);
}
bootDesk();

document.addEventListener("visibilitychange",()=>{
  ST._hidden=document.hidden;
});
bootLive();
armVexOpen();
if($("livePane")) $("livePane").onclick=function(){ openVexRight(); };
ST._vexLocked=true;
if(document.documentElement.classList.contains("embed")){
  const w=$("tvWrap"), f=$("tvFrame");
  if(f){ f.src="about:blank"; f.remove(); }
  if(w) w.remove();
} else {
  const f=$("tvFrame");
  if(f) f.src="https://broker.vexinvest.com/";
  bootBroker();
}
(function killTiinyBar(){
  const zap=()=>{
    document.querySelectorAll('a[href*="tiiny.host"],a[href*="tiiny.site"],img[src*="tiiny.host"]').forEach(n=>{
      const box=n.closest('div[style*="z-index"]')||n.closest('div[style*="position: fixed"]')||n.parentElement;
      if(box&&box!==document.body) box.remove();
      else n.remove();
    });
    document.querySelectorAll('div').forEach(el=>{
      const s=el.getAttribute('style')||'';
      if(/position:\s*fixed/i.test(s)&&/z-index:\s*9999/i.test(s)&&/bottom:\s*0/i.test(s)) el.remove();
    });
  };
  zap();
  setInterval(zap,400);
  try{new MutationObserver(zap).observe(document.documentElement,{childList:true,subtree:true});}catch(e){}
})();
</script>
